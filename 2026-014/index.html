<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>深圳罗湖 湖贝地铁站 国际名圆 · 改色效果预览</title>
<link rel="stylesheet" href="assets/slider.css">
<style>
  :root { --ink:#14161a; --muted:#6b7280; --line:#e7e5e0; --paper:#faf9f7; --accent:#8a6a3b; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
  header{padding:32px 20px 20px;border-bottom:1px solid var(--line)}
  .kicker{font-size:12px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
  h1{font-size:24px;margin:8px 0 6px;letter-spacing:-.01em}
  header p{margin:0;color:var(--muted);font-size:14px}
  main{padding:20px 16px 40px;display:grid;gap:28px;max-width:760px;margin:0 auto}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .card h2{font-size:15px;margin:2px 0 12px;font-weight:600}
  img-comparison-slider{display:block;border-radius:10px;overflow:hidden}
  img-comparison-slider img{display:block;width:100%;height:auto}
  .tag{position:absolute;top:10px;padding:3px 9px;border-radius:999px;font-size:12px;background:rgba(20,22,26,.72);color:#fff;letter-spacing:.04em}
  .tag-before{left:10px} .tag-after{right:10px;background:rgba(138,106,59,.9)}
  .zoom{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(138,106,59,.35)}
  .hint{margin:10px 2px 0;font-size:12.5px;color:var(--muted);text-align:center}
  footer{max-width:760px;margin:0 auto;padding:0 20px 60px;color:var(--muted);font-size:13px}
  .swatch{display:inline-block;margin:0 10px 6px 0;padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px}
</style></head><body>
<header>
  <div class="kicker">家具贴膜改色 · 效果预览</div>
  <h1>深圳罗湖 湖贝地铁站 国际名圆 · 改色效果预览</h1>
  <p>左右拖动中间把手，查看改色前后对比（现场实拍）</p>
</header>
<main>
  <section class="card">
    <h2>对比 1</h2>
    <img-comparison-slider class="slider">
      <img slot="first" src="assets/p0_before.jpg" data-webp="assets/p0_before.webp" alt="改色前" decoding="async">
      <img slot="second" src="assets/p0_after.jpg" data-webp="assets/p0_after.webp" alt="改色后" decoding="async">
      <div slot="first" class="tag tag-before">改色前</div>
      <div slot="second" class="tag tag-after">改色后</div>
    </img-comparison-slider>
    <p class="hint">← 拖动把手 →　<a class="zoom" href="full/p0_before.jpg">看原图·前</a> <a class="zoom" href="full/p0_after.jpg">看原图·后</a></p>
  </section></main>
<footer><p><span class="swatch">SK-MO DS011 磨砂素色膜（白）</span></p>
<p>施工：家具贴膜改色 · 深圳市 · 图片均为现场实拍</p></footer>
<script>
(function(){var t=new Image();t.onload=t.onerror=function(){
  if(t.height===2){document.querySelectorAll("img[data-webp]").forEach(
    function(el){el.src=el.getAttribute("data-webp");});}};
  t.src="data:image/webp;base64,UklGRiQAAABXRUJQVlA4IBgAAAAwAQCdASoBAAEAAwA0JaQAA3AA/vuUAAA=";})();
</script>
<script defer src="assets/slider.js"></script>
</body></html>
