<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">

<title>改色效果预览 · 案例库</title>
<style>
  :root{--ink:#14161a;--muted:#6b7280;--line:#e7e5e0;--paper:#faf9f7;--accent:#8a6a3b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:16px/1.65 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
  header{padding:40px 20px 24px;border-bottom:1px solid var(--line)}
  .kicker{font-size:12px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
  h1{font-size:26px;margin:8px 0 6px;letter-spacing:-.01em}
  header p{margin:0;color:var(--muted);font-size:14px}
  main{padding:22px 16px 60px;max-width:760px;margin:0 auto;display:grid;gap:12px}
  a.case{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:14px;
    text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  a.case strong{font-weight:600;font-size:15.5px}
  a.case span{color:var(--muted);font-size:13px;white-space:nowrap}
  footer{max-width:760px;margin:0 auto;padding:0 20px 60px;color:var(--muted);font-size:13px}
